    <!-- Splash Screen Styles for Ultra-Fast Initial Impression -->
    <style>
      #mr-splash {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        background-color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
        transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        pointer-events: all;
      }
      #mr-splash.mr-splash-done {
        opacity: 0;
        transform: scale(1.05);
        pointer-events: none;
      }
      .mr-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 24px;
        animation: mrLogoPop 0.45s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .mr-splash-logo {
        width: 175px;
        max-width: 70vw;
        height: auto;
        object-fit: contain;
        margin-bottom: 20px;
        filter: drop-shadow(0 12px 24px rgba(37, 99, 235, 0.12));
      }
      .mr-splash-title {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #0f172a;
        margin: 0;
        line-height: 1.2;
      }
      .mr-splash-title span {
        color: #2563eb;
      }
      .mr-splash-slogan {
        font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #64748b;
        margin-top: 6px;
      }
      @keyframes mrLogoPop {
        0% { opacity: 0; transform: scale(0.88); }
        100% { opacity: 1; transform: scale(1); }
      }
    </style>
  </head>
  <body class="bg-[#f8fafc] text-slate-900 antialiased selection:bg-[#2563eb] selection:text-white">
    <!-- Instant Splash Screen with Transparent Logo (No Loading Bar) -->
    <div id="mr-splash" aria-hidden="true">
      <div class="mr-splash-content">
        <img src="/images/logo_transparent.png" alt="Maquinaria Renteria" class="mr-splash-logo" />
        <h1 class="mr-splash-title">MAQUINARIA <span>RENTERIA</span></h1>
        <p class="mr-splash-slogan">El motor de tu tortillería</p>
      </div>
    </div>

    <script>
      (function() {
        var splash = document.getElementById('mr-splash');
        if (!splash) return;
        var dismissed = false;
        window.mrDismissSplash = function() {
          if (dismissed) return;
          dismissed = true;
          setTimeout(function() {
            splash.classList.add('mr-splash-done');
            setTimeout(function() {
              if (splash && splash.parentNode) {
                splash.parentNode.removeChild(splash);
              }
            }, 400);
          }, 500);
        };

        if (document.readyState === 'complete') {
          window.mrDismissSplash();
        } else {
          window.addEventListener('load', window.mrDismissSplash);
          setTimeout(window.mrDismissSplash, 800);
        }
      })();
    </script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
